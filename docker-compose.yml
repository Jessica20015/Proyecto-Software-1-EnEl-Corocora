services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: enel_camunda
      POSTGRES_USER: enel
      POSTGRES_PASSWORD: ${ENEL_POSTGRES_PASSWORD:-enel-local}
    ports:
      - "5432:5432"
    volumes:
      - enel-postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enel -d enel_camunda"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  enel-postgres-data:
